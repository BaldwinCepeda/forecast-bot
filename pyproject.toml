[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-champion-poc"
version = "0.1.0"
description = "Local opportunity and role-demand forecasting proof of concept"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3.0", "SQLAlchemy>=2.0,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
demand-poc = "demand_poc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
demand_poc = ["dashboard.html"]
